<h2>Lista de Elementos Químicos</h2>
<ul>
  <li *ngFor="let elemento of elementoService.elementos">
    {{ elemento.nome }} ({{ elemento.simbolo }})

    <button (click)="alternarFavorito(elemento)">
      @if (elementoService.obterFavoritos().includes(elemento)) {
        <span>
          <i class="fa-solid fa-star"></i>
        </span>
      } @else {
        <span>
          <i class="fa-regular fa-star"></i>
        </span>
      }
    </button>
  </li>
</ul>
